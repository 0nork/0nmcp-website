<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1510"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="tg"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Slack icon stylized -->
  <g transform="translate(320, 40)">
    <rect x="0" y="0" width="160" height="56" rx="8" fill="#111118" stroke="#7ed957" stroke-width="1.5"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#7ed957">/0n</text>
    <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5cb83a">Slack Command</text>
    <circle cx="145" cy="28" r="5" fill="#7ed957" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- 11 Command Cards in grid -->
  <g font-family="'JetBrains Mono', monospace" font-size="9">
    <!-- Row 1 -->
    <g><rect x="60" y="120" width="130" height="44" rx="6" fill="#111118" stroke="#7ed957" stroke-width="1"/><text x="72" y="140" fill="#7ed957">/0n leads</text><text x="72" y="154" fill="#8888a0" font-size="8">Show hot leads</text></g>
    <g><rect x="210" y="120" width="130" height="44" rx="6" fill="#111118" stroke="#00d4ff" stroke-width="1"/><text x="222" y="140" fill="#00d4ff">/0n score</text><text x="222" y="154" fill="#8888a0" font-size="8">AI lead scoring</text></g>
    <g><rect x="360" y="120" width="130" height="44" rx="6" fill="#111118" stroke="#a78bfa" stroke-width="1"/><text x="372" y="140" fill="#a78bfa">/0n pipeline</text><text x="372" y="154" fill="#8888a0" font-size="8">Revenue view</text></g>
    <g><rect x="510" y="120" width="130" height="44" rx="6" fill="#111118" stroke="#7ed957" stroke-width="1"/><text x="522" y="140" fill="#7ed957">/0n book</text><text x="522" y="154" fill="#8888a0" font-size="8">Schedule apt</text></g>

    <!-- Row 2 -->
    <g><rect x="60" y="180" width="130" height="44" rx="6" fill="#111118" stroke="#00d4ff" stroke-width="1"/><text x="72" y="200" fill="#00d4ff">/0n send</text><text x="72" y="214" fill="#8888a0" font-size="8">SMS contact</text></g>
    <g><rect x="210" y="180" width="130" height="44" rx="6" fill="#111118" stroke="#a78bfa" stroke-width="1"/><text x="222" y="200" fill="#a78bfa">/0n email</text><text x="222" y="214" fill="#8888a0" font-size="8">Send email</text></g>
    <g><rect x="360" y="180" width="130" height="44" rx="6" fill="#111118" stroke="#7ed957" stroke-width="1"/><text x="372" y="200" fill="#7ed957">/0n course</text><text x="372" y="214" fill="#8888a0" font-size="8">Generate course</text></g>
    <g><rect x="510" y="180" width="130" height="44" rx="6" fill="#111118" stroke="#00d4ff" stroke-width="1"/><text x="522" y="200" fill="#00d4ff">/0n revenue</text><text x="522" y="214" fill="#8888a0" font-size="8">Revenue stats</text></g>
  </g>

  <!-- Stats badge -->
  <g transform="translate(560, 280)">
    <rect x="0" y="0" width="180" height="60" rx="8" fill="#1a1a25" stroke="#7ed957" stroke-width="1.5"/>
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8888a0">TOOLS REPLACED</text>
    <text x="16" y="46" font-family="'Instrument Sans', sans-serif" font-size="24" font-weight="900" fill="#7ed957" filter="url(#tg)">14 SaaS</text>
  </g>

  <!-- Cost badge -->
  <g transform="translate(560, 355)">
    <rect x="0" y="0" width="180" height="60" rx="8" fill="#1a1a25" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8888a0">MONTHLY SAVINGS</text>
    <text x="16" y="46" font-family="'Instrument Sans', sans-serif" font-size="24" font-weight="900" fill="#00d4ff" filter="url(#tg)">$346/mo</text>
  </g>

  <!-- Slack message preview -->
  <rect x="60" y="260" width="460" height="150" rx="8" fill="#111118" stroke="#2a2a3a" stroke-width="1"/>
  <text x="82" y="288" font-family="'Instrument Sans', sans-serif" font-size="12" font-weight="700" fill="#e8e8ef">New Lead — Sarah Chen</text>
  <text x="82" y="308" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8888a0">sarah@acme.com · (555) 234-5678</text>
  <text x="82" y="328" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8888a0">Source: Facebook Ad</text>
  <!-- Action buttons -->
  <rect x="82" y="345" width="80" height="28" rx="6" fill="#7ed957" opacity="0.15"/>
  <text x="98" y="364" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#7ed957">Score</text>
  <rect x="172" y="345" width="80" height="28" rx="6" fill="#00d4ff" opacity="0.15"/>
  <text x="196" y="364" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00d4ff">Call</text>
  <rect x="262" y="345" width="80" height="28" rx="6" fill="#a78bfa" opacity="0.15"/>
  <text x="280" y="364" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#a78bfa">Email</text>

  <!-- Dots -->
  <circle cx="740" cy="40" r="3" fill="#7ed957" opacity="0.4"/>
  <circle cx="755" cy="40" r="3" fill="#7ed957" opacity="0.25"/>
  <circle cx="770" cy="40" r="3" fill="#7ed957" opacity="0.15"/>
</svg>
