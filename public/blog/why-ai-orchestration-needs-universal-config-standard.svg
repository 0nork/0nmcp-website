<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#141020" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fileFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGlow)"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Central glow -->
  <circle cx="400" cy="195" r="140" fill="url(#centerGlow)" opacity="0.8"/>

  <!-- Central .0n config file icon -->
  <g transform="translate(400, 180)" filter="url(#softGlow)">
    <!-- File shape -->
    <path d="M-28 -45 L15 -45 L28 -32 L28 45 L-28 45 Z" fill="url(#fileFill)" stroke="#a78bfa" stroke-width="1.5" opacity="0.9"/>
    <!-- Fold corner -->
    <path d="M15 -45 L15 -32 L28 -32" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.7"/>
    <!-- Code lines inside -->
    <line x1="-18" y1="-25" x2="8" y2="-25" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
    <line x1="-18" y1="-14" x2="18" y2="-14" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
    <line x1="-18" y1="-3" x2="14" y2="-3" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
    <line x1="-18" y1="8" x2="18" y2="8" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
    <line x1="-18" y1="19" x2="10" y2="19" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
    <line x1="-18" y1="30" x2="16" y2="30" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- .0n label on file -->
  <text x="400" y="255" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a78bfa" opacity="0.8" font-weight="700" filter="url(#glow)">.0n</text>

  <!-- Fragmented config icons (left side - the problem) -->
  <g transform="translate(120, 130)" opacity="0.5">
    <rect x="-12" y="-15" width="24" height="30" rx="2" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
    <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ff6b6b" opacity="0.7">.env</text>
  </g>
  <g transform="translate(120, 200)" opacity="0.5">
    <rect x="-12" y="-15" width="24" height="30" rx="2" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
    <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ff6b6b" opacity="0.7">.yml</text>
  </g>
  <g transform="translate(120, 270)" opacity="0.5">
    <rect x="-12" y="-15" width="24" height="30" rx="2" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
    <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ff6b6b" opacity="0.7">.json</text>
  </g>

  <!-- Arrow lines from fragments to center -->
  <g stroke="#a78bfa" stroke-width="1" opacity="0.25" stroke-dasharray="5 4">
    <line x1="145" y1="130" x2="365" y2="170"/>
    <line x1="145" y1="200" x2="365" y2="190"/>
    <line x1="145" y1="270" x2="365" y2="210"/>
  </g>

  <!-- Unified output icons (right side - the solution) -->
  <g stroke="#a78bfa" stroke-width="1" opacity="0.25" stroke-dasharray="5 4">
    <line x1="435" y1="170" x2="625" y2="120"/>
    <line x1="435" y1="190" x2="625" y2="190"/>
    <line x1="435" y1="210" x2="625" y2="260"/>
  </g>

  <!-- Platform nodes right side -->
  <g filter="url(#glow)">
    <circle cx="640" cy="120" r="6" fill="#a78bfa" opacity="0.7"/>
    <circle cx="640" cy="190" r="6" fill="#a78bfa" opacity="0.7"/>
    <circle cx="640" cy="260" r="6" fill="#a78bfa" opacity="0.7"/>
  </g>
  <text x="658" y="124" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a78bfa" opacity="0.6">Claude</text>
  <text x="658" y="194" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a78bfa" opacity="0.6">Cursor</text>
  <text x="658" y="264" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a78bfa" opacity="0.6">Windsurf</text>

  <!-- "UNIVERSAL" arc text substitute -->
  <text x="400" y="90" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a78bfa" opacity="0.4" letter-spacing="0.3em">UNIVERSAL CONFIG</text>

  <!-- Small decorative dots -->
  <g filter="url(#glow)">
    <circle cx="200" cy="90" r="1.5" fill="#a78bfa" opacity="0.3"/>
    <circle cx="600" cy="80" r="1.5" fill="#a78bfa" opacity="0.25"/>
    <circle cx="250" cy="320" r="1.5" fill="#a78bfa" opacity="0.3"/>
    <circle cx="550" cy="310" r="1.5" fill="#a78bfa" opacity="0.25"/>
    <circle cx="700" cy="330" r="2" fill="#a78bfa" opacity="0.2"/>
    <circle cx="80" cy="340" r="2" fill="#a78bfa" opacity="0.2"/>
  </g>

  <!-- Decorative rings -->
  <circle cx="400" cy="195" r="100" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.08"/>
  <circle cx="400" cy="195" r="160" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.05"/>
  <circle cx="400" cy="195" r="220" fill="none" stroke="#7ed957" stroke-width="0.5" opacity="0.04"/>
  <circle cx="400" cy="195" r="280" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.03"/>

  <!-- Category label -->
  <text x="40" y="385" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa" opacity="0.6" letter-spacing="0.15em">DEEP DIVE</text>

  <!-- Title bottom-left -->
  <text x="40" y="410" font-family="'Instrument Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" opacity="0.9">Why AI Orchestration Needs a</text>
  <text x="40" y="435" font-family="'Instrument Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" opacity="0.9">Universal Config Standard</text>
</svg>