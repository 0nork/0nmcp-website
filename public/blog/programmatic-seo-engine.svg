<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a10" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGlow)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Central glow -->
  <circle cx="400" cy="200" r="130" fill="url(#centerGlow)" opacity="0.6"/>

  <!-- Page tree visualization -->
  <!-- Root node -->
  <rect x="370" y="60" width="60" height="26" rx="4" fill="#1a1a25" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
  <text x="400" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fbbf24">/</text>

  <!-- Level 1 branches -->
  <g stroke="#fbbf24" stroke-width="1" opacity="0.3">
    <line x1="400" y1="86" x2="160" y2="130"/>
    <line x1="400" y1="86" x2="310" y2="130"/>
    <line x1="400" y1="86" x2="490" y2="130"/>
    <line x1="400" y1="86" x2="640" y2="130"/>
  </g>

  <!-- Level 1 nodes -->
  <g filter="url(#glow)">
    <rect x="110" y="130" width="100" height="22" rx="3" fill="#1a1a25" stroke="#7ed957" stroke-width="1"/>
    <text x="160" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7ed957">/integrations</text>

    <rect x="265" y="130" width="90" height="22" rx="3" fill="#1a1a25" stroke="#00d4ff" stroke-width="1"/>
    <text x="310" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00d4ff">/glossary</text>

    <rect x="445" y="130" width="90" height="22" rx="3" fill="#1a1a25" stroke="#a78bfa" stroke-width="1"/>
    <text x="490" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a78bfa">/compare</text>

    <rect x="590" y="130" width="100" height="22" rx="3" fill="#1a1a25" stroke="#ff6b35" stroke-width="1"/>
    <text x="640" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ff6b35">/turn-it-on</text>
  </g>

  <!-- Level 2 branches -->
  <g stroke="#7ed957" stroke-width="0.8" opacity="0.25">
    <line x1="160" y1="152" x2="90" y2="190"/>
    <line x1="160" y1="152" x2="160" y2="190"/>
    <line x1="160" y1="152" x2="230" y2="190"/>
  </g>
  <g stroke="#00d4ff" stroke-width="0.8" opacity="0.25">
    <line x1="310" y1="152" x2="270" y2="190"/>
    <line x1="310" y1="152" x2="350" y2="190"/>
  </g>
  <g stroke="#a78bfa" stroke-width="0.8" opacity="0.25">
    <line x1="490" y1="152" x2="450" y2="190"/>
    <line x1="490" y1="152" x2="530" y2="190"/>
  </g>
  <g stroke="#ff6b35" stroke-width="0.8" opacity="0.25">
    <line x1="640" y1="152" x2="590" y2="190"/>
    <line x1="640" y1="152" x2="640" y2="190"/>
    <line x1="640" y1="152" x2="700" y2="190"/>
  </g>

  <!-- Level 2 leaf nodes -->
  <g filter="url(#glow)" opacity="0.7">
    <circle cx="90" cy="195" r="5" fill="#7ed957"/>
    <circle cx="160" cy="195" r="5" fill="#7ed957"/>
    <circle cx="230" cy="195" r="5" fill="#7ed957"/>
    <circle cx="270" cy="195" r="5" fill="#00d4ff"/>
    <circle cx="350" cy="195" r="5" fill="#00d4ff"/>
    <circle cx="450" cy="195" r="5" fill="#a78bfa"/>
    <circle cx="530" cy="195" r="5" fill="#a78bfa"/>
    <circle cx="590" cy="195" r="5" fill="#ff6b35"/>
    <circle cx="640" cy="195" r="5" fill="#ff6b35"/>
    <circle cx="700" cy="195" r="5" fill="#ff6b35"/>
  </g>

  <!-- Ellipsis dots for more pages -->
  <g fill="#444" opacity="0.5">
    <circle cx="120" cy="220" r="2"/>
    <circle cx="130" cy="220" r="2"/>
    <circle cx="140" cy="220" r="2"/>
    <circle cx="300" cy="220" r="2"/>
    <circle cx="310" cy="220" r="2"/>
    <circle cx="320" cy="220" r="2"/>
    <circle cx="480" cy="220" r="2"/>
    <circle cx="490" cy="220" r="2"/>
    <circle cx="500" cy="220" r="2"/>
    <circle cx="630" cy="220" r="2"/>
    <circle cx="640" cy="220" r="2"/>
    <circle cx="650" cy="220" r="2"/>
  </g>

  <!-- Big number — 300+ -->
  <text x="72" y="320" font-family="'Instrument Sans', sans-serif" font-size="68" font-weight="900" fill="#fbbf24" opacity="0.12" letter-spacing="-3">300+</text>
  <text x="71" y="319" font-family="'Instrument Sans', sans-serif" font-size="68" font-weight="900" fill="#fbbf24" opacity="0.85" letter-spacing="-3" filter="url(#textGlow)">300+</text>
  <text x="76" y="340" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fbbf24" letter-spacing="0.15em" opacity="0.7">PAGES</text>

  <!-- JSON-LD badge stack -->
  <g opacity="0.7">
    <rect x="560" y="260" width="190" height="20" rx="3" fill="#1a1a25" stroke="#7ed957" stroke-width="0.8"/>
    <text x="655" y="274" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7ed957">DiscussionForumPosting</text>

    <rect x="560" y="286" width="190" height="20" rx="3" fill="#1a1a25" stroke="#00d4ff" stroke-width="0.8"/>
    <text x="655" y="300" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00d4ff">DefinedTerm + FAQPage</text>

    <rect x="560" y="312" width="190" height="20" rx="3" fill="#1a1a25" stroke="#a78bfa" stroke-width="0.8"/>
    <text x="655" y="326" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a78bfa">Product + HowTo</text>

    <rect x="560" y="338" width="190" height="20" rx="3" fill="#1a1a25" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="655" y="352" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fbbf24">BreadcrumbList + Person</text>
  </g>
  <text x="655" y="250" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#888" letter-spacing="0.1em">JSON-LD SCHEMA</text>

  <!-- Title bottom-left -->
  <text x="40" y="395" font-family="'Instrument Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" opacity="0.9">Programmatic SEO Engine</text>
  <text x="40" y="418" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24" opacity="0.6">4 JSON files. 300+ indexable pages. Zero CMS.</text>

  <!-- Version badge -->
  <rect x="636" y="18" width="146" height="28" rx="5" fill="#1a1a25" stroke="#fbbf24" stroke-width="1" opacity="0.9"/>
  <text x="709" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24">0nmcp.com</text>
</svg>