name: Deploy to Vercel (zero build minutes)

# Build runs entirely on GitHub Actions runners. Vercel only hosts the
# pre-built artifacts (vercel deploy --prebuilt), so Vercel build minutes
# are NOT consumed.
#
# Auto-detects npm / pnpm / yarn from the repo's lockfile.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        run: |
          if   [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ];      then echo "name=yarn" >> "$GITHUB_OUTPUT"
          else                              echo "name=npm"  >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Back to 20, the version that was green through 2026-07-29. It was
          # only raised to satisfy pnpm, and pnpm is no longer in this route —
          # see the lockfile note below.
          node-version: 20

      - name: Enable corepack (pnpm/yarn support)
        run: |
          corepack enable
          if [ "${{ steps.pm.outputs.name }}" = "pnpm" ]; then
            # PINNED. `pnpm@latest` here is an outage with a delay fuse: nothing in
            # this repo changed, `latest` moved to pnpm 11, and 21 days of pushes
            # deployed nothing. Same incident that took rocketopp-live out for 17.
            corepack prepare pnpm@10.15.0 --activate
            pnpm --version
          elif [ "${{ steps.pm.outputs.name }}" = "yarn" ]; then
            corepack prepare yarn@stable --activate
            yarn --version
          fi

      - name: Install Vercel CLI
        # PINNED TO 58.3.0 — the exact CLI that produced this repo's last green
        # deploy (2026-07-29). Not merely "a major": 59.x fails the prebuilt
        # upload here with `ENOENT ... @opentelemetry/api/build/src/api/diag.js`,
        # a file Next's tracing lists and the packer then cannot stat. `latest`
        # was the second delay fuse in this route, hiding behind the first.
        run: npm install --global vercel@58.3.0

      - name: Pull Vercel project config + env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) pnpm install --no-frozen-lockfile ;;
            yarn) yarn install --network-timeout 600000 ;;
            npm)  npm install --legacy-peer-deps --no-audit --no-fund ;;
          esac

      - name: Build with Vercel CLI
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy pre-built artifacts to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $DEPLOY_URL"

      - name: Summary
        run: |
          echo "### ✅ Deployed (zero Vercel build minutes used)" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.url }}"             >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`"                    >> "$GITHUB_STEP_SUMMARY"
          echo "Package manager: \`${{ steps.pm.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
