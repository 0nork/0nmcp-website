// ─── Render ───
const content = document.getElementById('content');
const search = document.getElementById('search');

const categories = {
  public: { title: 'Public / Marketing Pages', type: 'page' },
  seo: { title: 'SEO / Programmatic Pages', type: 'page' },
  product: { title: 'Product Pages', type: 'page' },
  console: { title: 'Console (Dashboard)', type: 'console' },
  admin: { title: 'Admin Pages', type: 'admin' },
  auth: { title: 'Auth / System Pages', type: 'auth' },
};

function render(filter = 'all', query = '') {
  content.innerHTML = '';
  const q = query.toLowerCase();
  let counts = { total: 0, public: 0, console: 0, admin: 0, auth: 0 };

  for (const [catKey, catInfo] of Object.entries(categories)) {
    const pages = PAGES.filter(p => {
      if (p.cat !== catKey) return false;
      if (filter !== 'all' && p.cat !== filter) return false;
      if (q && !p.path.toLowerCase().includes(q) && !p.label.toLowerCase().includes(q)) return false;
      return true;
    });
    if (pages.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `<div class="section-title">${catInfo.title} <span class="count">${pages.length}</span></div>`;

    const grid = document.createElement('div');
    grid.className = 'grid';

    for (const p of pages) {
      const a = document.createElement('a');
      a.className = 'link';
      a.href = p.dyn ? '#' : BASE + p.path;
      a.target = p.dyn ? '' : '_blank';
      a.rel = 'noopener';
      if (p.dyn) a.title = 'Dynamic route — needs a slug parameter';

      const typeClass = p.dyn ? 'type-dynamic' : catKey === 'admin' ? 'type-admin' : catKey === 'console' ? 'type-console' : catKey === 'auth' ? 'type-auth' : 'type-page';
      const typeLabel = p.dyn ? 'Dynamic' : catKey.toUpperCase();

      a.innerHTML = `<span class="link-path">${p.path}</span><span class="link-type ${typeClass}">${typeLabel}</span>`;
      grid.appendChild(a);

      counts.total++;
      if (catKey === 'public' || catKey === 'seo' || catKey === 'product') counts.public++;
      else if (catKey === 'console') counts.console++;
      else if (catKey === 'admin') counts.admin++;
      else if (catKey === 'auth') counts.auth++;
    }

    section.appendChild(grid);
    content.appendChild(section);
  }

  document.getElementById('total-count').textContent = counts.total;
  document.getElementById('public-count').textContent = counts.public;
  document.getElementById('console-count').textContent = counts.console;
  document.getElementById('admin-count').textContent = counts.admin;
  document.getElementById('auth-count').textContent = counts.auth;
}

// ─── Events ───
let activeFilter = 'all';
search.addEventListener('input', () => render(activeFilter, search.value));

document.getElementById('filters').addEventListener('click', (e) => {
  if (e.target.classList.contains('filter-btn')) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.dataset.filter;
    render(activeFilter, search.value);
  }
});
