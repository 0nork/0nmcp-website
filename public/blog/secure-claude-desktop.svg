<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
    <linearGradient id="shield" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="green" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#6EE05A"/>
      <stop offset="100%" style="stop-color:#5cb83a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#6EE05A" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Warning glow -->
  <circle cx="400" cy="180" r="120" fill="url(#shield)" opacity="0.06"/>
  <circle cx="400" cy="180" r="80" fill="url(#shield)" opacity="0.08"/>
  <!-- Shield icon -->
  <path d="M400 110 L450 135 L450 190 C450 220 430 245 400 260 C370 245 350 220 350 190 L350 135 Z" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
  <path d="M385 185 L395 195 L415 170" fill="none" stroke="#6EE05A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Alert lines -->
  <rect x="480" y="140" width="180" height="8" rx="4" fill="#ef4444" opacity="0.2"/>
  <rect x="480" y="158" width="140" height="8" rx="4" fill="#ef4444" opacity="0.15"/>
  <rect x="480" y="176" width="160" height="8" rx="4" fill="#ef4444" opacity="0.1"/>
  <rect x="140" y="140" width="120" height="8" rx="4" fill="#6EE05A" opacity="0.15"/>
  <rect x="140" y="158" width="100" height="8" rx="4" fill="#6EE05A" opacity="0.1"/>
  <rect x="140" y="176" width="80" height="8" rx="4" fill="#6EE05A" opacity="0.08"/>
  <!-- Title -->
  <text x="400" y="320" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.02em">The March 2026 Supply Chain Attack</text>
  <text x="400" y="350" text-anchor="middle" fill="#888888" font-family="system-ui, sans-serif" font-size="16" font-weight="400">How 0nDefender Stops It — Free, Open Source, MIT Licensed</text>
  <!-- Brand -->
  <text x="400" y="410" text-anchor="middle" fill="#6EE05A" font-family="monospace" font-size="13" font-weight="700" letter-spacing="0.05em">0nMCP · 0nDEFENDER · SECURITY</text>
  <!-- Corner accent -->
  <rect x="30" y="30" width="3" height="30" rx="1.5" fill="#ef4444" opacity="0.6"/>
  <rect x="30" y="30" width="30" height="3" rx="1.5" fill="#ef4444" opacity="0.6"/>
  <rect x="767" y="417" width="3" height="30" rx="1.5" fill="#6EE05A" opacity="0.4" transform="rotate(180 768.5 432)"/>
  <rect x="737" y="447" width="30" height="3" rx="1.5" fill="#6EE05A" opacity="0.4" transform="rotate(180 752 448.5)"/>
</svg>
