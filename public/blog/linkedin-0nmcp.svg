<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
    <linearGradient id="linkedin" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#0A66C2"/>
      <stop offset="100%" style="stop-color:#004182"/>
    </linearGradient>
    <linearGradient id="green" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#6EE05A"/>
      <stop offset="100%" style="stop-color:#5cb83a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#6EE05A" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- LinkedIn glow -->
  <circle cx="320" cy="180" r="90" fill="url(#linkedin)" opacity="0.08"/>
  <!-- 0nMCP glow -->
  <circle cx="480" cy="180" r="90" fill="url(#green)" opacity="0.08"/>
  <!-- Connection line -->
  <line x1="360" y1="180" x2="440" y2="180" stroke="#6EE05A" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- LinkedIn icon -->
  <rect x="290" y="145" width="60" height="60" rx="10" fill="url(#linkedin)" opacity="0.9"/>
  <text x="320" y="187" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="28" font-weight="800">in</text>
  <!-- 0nMCP icon -->
  <rect x="450" y="145" width="60" height="60" rx="10" fill="url(#green)" opacity="0.9"/>
  <text x="480" y="185" text-anchor="middle" fill="white" font-family="monospace" font-size="18" font-weight="800">0n</text>
  <!-- Stats badges -->
  <rect x="180" y="240" width="120" height="28" rx="14" fill="url(#linkedin)" opacity="0.15"/>
  <text x="240" y="259" text-anchor="middle" fill="#0A66C2" font-family="system-ui, sans-serif" font-size="11" font-weight="700">50 API Endpoints</text>
  <rect x="320" y="240" width="160" height="28" rx="14" fill="url(#green)" opacity="0.15"/>
  <text x="400" y="259" text-anchor="middle" fill="#6EE05A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Full Ad Management</text>
  <rect x="500" y="240" width="120" height="28" rx="14" fill="rgba(167,139,250,0.15)"/>
  <text x="560" y="259" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Certifications</text>
  <!-- Title -->
  <text x="400" y="320" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.02em">LinkedIn Meets 0nMCP</text>
  <text x="400" y="350" text-anchor="middle" fill="#888888" font-family="system-ui, sans-serif" font-size="16" font-weight="400">50 Tools, Full Ad Management, and Industry-First Certifications</text>
  <!-- Brand -->
  <text x="400" y="410" text-anchor="middle" fill="#6EE05A" font-family="monospace" font-size="13" font-weight="700" letter-spacing="0.05em">0nMCP · LINKEDIN INTEGRATION · 1,183 TOOLS</text>
  <!-- Corner accents -->
  <rect x="30" y="30" width="3" height="30" rx="1.5" fill="#0A66C2" opacity="0.6"/>
  <rect x="30" y="30" width="30" height="3" rx="1.5" fill="#0A66C2" opacity="0.6"/>
  <rect x="767" y="417" width="3" height="30" rx="1.5" fill="#6EE05A" opacity="0.4" transform="rotate(180 768.5 432)"/>
  <rect x="737" y="447" width="30" height="3" rx="1.5" fill="#6EE05A" opacity="0.4" transform="rotate(180 752 448.5)"/>
</svg>
