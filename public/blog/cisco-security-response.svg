    <line x1="90" y1="60" x2="50" y2="100" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="400" y="220" text-anchor="middle" font-family="'Instrument Sans', sans-serif" font-size="11" fill="#8888a0" letter-spacing="0.15em">CISCO SECURITY RESEARCH</text>
  <text x="400" y="250" text-anchor="middle" font-family="'Instrument Sans', sans-serif" font-size="22" font-weight="900" fill="#ef4444">"Security Nightmare"</text>
  <text x="400" y="278" text-anchor="middle" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600" fill="#e8e8ef">OpenClaw MCP Hosting Vulnerabilities</text>

