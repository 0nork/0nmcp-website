    <g><rect x="240" y="305" width="160" height="50" rx="6" fill="#111118" stroke="#ef4444" stroke-width="1"/><text x="256" y="326" fill="#ef4444" font-weight="700">No Sandboxing</text><text x="256" y="342" fill="#8888a0">Shared infrastructure</text></g>
    <g><rect x="420" y="305" width="160" height="50" rx="6" fill="#111118" stroke="#ef4444" stroke-width="1"/><text x="436" y="326" fill="#ef4444" font-weight="700">Supply Chain Risk</text><text x="436" y="342" fill="#8888a0">Unverified packages</text></g>
    <g><rect x="600" y="305" width="160" height="50" rx="6" fill="#111118" stroke="#ef4444" stroke-width="1"/><text x="616" y="326" fill="#ef4444" font-weight="700">Data Leakage</text><text x="616" y="342" fill="#8888a0">Cross-tenant exposure</text></g>
  </g>

  <!-- 0nMCP response badge -->
  <g transform="translate(240, 375)">
    <rect x="0" y="0" width="320" height="50" rx="8" fill="#1a1a25" stroke="#7ed957" stroke-width="1.5"/>
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8888a0">0nMCP RESPONSE</text>
    <text x="20" y="40" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="700" fill="#7ed957">AES-256-GCM + Hardware Fingerprint</text>
